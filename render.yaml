services:
  - type: web
    name: crm-process-optimizer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run artifacts/crm-optimizer/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: OPENAI_API_KEY
        sync: false
