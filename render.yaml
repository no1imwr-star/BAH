services:
  - type: web
    name: crm-process-optimizer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd artifacts/crm-optimizer && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
